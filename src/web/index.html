<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xiangshan · Geo Reverse Lookup</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

    #map { position: absolute; inset: 0; }

    /* ── Panel ───────────────────────────────────────────────────── */
    #panel {
      position: absolute;
      top: 16px; right: 16px;
      width: 300px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 14px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.13), 0 1px 4px rgba(0,0,0,0.07);
      overflow: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }

    #panel.hidden { opacity: 0; pointer-events: none; transform: translateX(10px); }

    .panel-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f0f0f0;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.98);
      z-index: 1;
    }

    .panel-coords {
      font-size: 12px;
      color: #555;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      letter-spacing: 0.3px;
    }

    .panel-elapsed {
      font-size: 11px;
      color: #aaa;
      margin-top: 3px;
    }

    /* ── Level rows ──────────────────────────────────────────────── */
    .level-row {
      display: flex;
      align-items: flex-start;
      padding: 11px 14px;
      border-bottom: 1px solid #f5f5f5;
    }
    .level-row:last-child { border-bottom: none; }

    .level-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      margin-right: 11px;
      margin-top: 1px;
    }

    .icon-country    { background: #dbeafe; }
    .icon-region     { background: #dcfce7; }
    .icon-county     { background: #fef9c3; }
    .icon-local-admin{ background: #fce7f3; }
    .icon-locality   { background: #ede9fe; }

    .level-meta { flex: 1; min-width: 0; }

    .level-label {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #aaa;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .level-name {
      font-size: 14.5px;
      font-weight: 600;
      color: #111;
      line-height: 1.3;
      word-break: break-word;
    }

    .level-names {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .name-tag {
      font-size: 11px;
      padding: 2px 7px;
      background: #f3f4f6;
      border-radius: 5px;
      color: #444;
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .name-tag .lang-code {
      font-weight: 700;
      color: #999;
      margin-right: 3px;
      font-size: 10px;
      text-transform: uppercase;
    }

    /* ── Empty / Error ───────────────────────────────────────────── */
    .msg { padding: 18px 16px; font-size: 13px; color: #888; text-align: center; line-height: 1.5; }
    .msg.error { color: #ef4444; }

    /* ── Loading overlay ─────────────────────────────────────────── */
    #loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 18px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #444;
      pointer-events: none;
    }
    #loading.hidden { display: none; }

    .spinner {
      width: 17px; height: 17px;
      border: 2px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.55s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Hint pill ───────────────────────────────────────────────── */
    #hint {
      position: absolute;
      bottom: 36px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.62);
      color: #fff;
      font-size: 12.5px;
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }
    #hint.hidden { opacity: 0; }

    /* ── MapLibre overrides ──────────────────────────────────────── */
    .maplibregl-ctrl-bottom-right { bottom: 36px; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="panel" class="hidden">
  <div class="panel-header">
    <div class="panel-coords" id="coords">—</div>
    <div class="panel-elapsed" id="elapsed"></div>
  </div>
  <div id="levels"></div>
</div>

<div id="loading" class="hidden">
  <div class="spinner"></div>
  Looking up location…
</div>

<div id="hint">Click anywhere on the map to reverse-geocode</div>

<script>
  // ── Configuration ────────────────────────────────────────────────────────
  // Replace with your Protomaps API key: https://protomaps.com/account
  const PROTOMAPS_KEY = '85d5c49ed62d00a1';

  const API_BASE = '/api';

  // Language codes to display as alternative name tags (in priority order)
  const LANG_PRIORITY = ['en', 'zh', 'zh-Hans', 'zh-Hant', 'ja', 'ko', 'fr', 'de', 'es', 'ru', 'ar', 'pt'];
  // ─────────────────────────────────────────────────────────────────────────

  const LEVELS = [
    { key: 'country',     label: 'Country',           icon: '🌍', cls: 'icon-country'     },
    { key: 'region',      label: 'Region / State',    icon: '🗺️', cls: 'icon-region'      },
    { key: 'county',      label: 'County / District', icon: '🏛️', cls: 'icon-county'      },
    { key: 'local_admin', label: 'Local Admin',        icon: '🏘️', cls: 'icon-local-admin' },
    { key: 'locality',    label: 'City / Locality',   icon: '🏙️', cls: 'icon-locality'    },
  ];

  // Register PMTiles protocol so MapLibre can read pmtiles:// URLs
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  const map = new maplibregl.Map({
    container: 'map',
    style: `https://api.protomaps.com/styles/v2/light.json?key=${PROTOMAPS_KEY}`,
    center: [20, 25],
    zoom: 2.2,
    attributionControl: { compact: true, customAttribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>, <a href="https://overturemaps.org" target="_blank">Overture Maps Foundation</a>' },
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

  map.getCanvas().style.cursor = 'crosshair';

  // ── Level colors shared by panel icons and map layers ────────────────────
  const LEVEL_COLORS = {
    country:     '#3b82f6',
    region:      '#22c55e',
    county:      '#eab308',
    local_admin: '#ec4899',
    locality:    '#a855f7',
  };

  const COLOR_EXPR = ['match', ['get', 'level'],
    ...Object.entries(LEVEL_COLORS).flat(),
    '#888888',
  ];

  // ── Set up polygon source + layers once the map style loads ──────────────
  const EMPTY_FC = { type: 'FeatureCollection', features: [] };

  map.on('load', () => {
    map.addSource('divisions', { type: 'geojson', data: EMPTY_FC });

    // Insert fill + stroke below the first symbol (label) layer so text stays on top
    const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;

    map.addLayer({
      id: 'divisions-fill',
      type: 'fill',
      source: 'divisions',
      paint: { 'fill-color': COLOR_EXPR, 'fill-opacity': 0.1 },
    }, firstSymbol);

    map.addLayer({
      id: 'divisions-line',
      type: 'line',
      source: 'divisions',
      paint: {
        'line-color': COLOR_EXPR,
        'line-opacity': 0.7,
        'line-width': ['match', ['get', 'level'],
          'country', 1.5, 'region', 1.2, 'county', 1.0, 1.0,
        ],
      },
    }, firstSymbol);
  });

  let marker = null;

  map.on('click', (e) => {
    const { lng, lat } = e.lngLat;
    query(lng, lat);
  });

  // ── Query ────────────────────────────────────────────────────────────────

  async function query(lng, lat) {
    setLoading(true);
    panel('hidden');
    hint(true);

    if (marker) marker.remove();
    marker = new maplibregl.Marker({ color: '#3b82f6' })
      .setLngLat([lng, lat])
      .addTo(map);

    const url = `${API_BASE}?lng=${lng.toFixed(6)}&lat=${lat.toFixed(6)}&format=geojson`;

    try {
      const data = await fetch(url).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
      renderResult(data, lng, lat);
      setPolygons(data);
    } catch (err) {
      renderError(err.message, lng, lat);
      setPolygons(null);
    } finally {
      setLoading(false);
    }
  }

  function setPolygons(geojson) {
    const src = map.getSource('divisions');
    if (src) src.setData(geojson?.features?.length ? geojson : EMPTY_FC);
  }

  // ── Render ───────────────────────────────────────────────────────────────

  function renderResult(data, lng, lat) {
    $('coords').textContent = `${fmtCoord(lng, 'EW')}, ${fmtCoord(lat, 'NS')}`;
    $('elapsed').textContent = data.elapsed_ms != null
      ? `Query: ${data.elapsed_ms.toFixed(0)} ms`
      : '';

    const present = LEVELS.filter(l => data[l.key]);

    $('levels').innerHTML = present.length
      ? present.map(l => levelRowHTML(l, data[l.key])).join('')
      : '<p class="msg">No administrative data found for this location.</p>';

    panel('show');
  }

  function renderError(msg, lng, lat) {
    $('coords').textContent = `${fmtCoord(lng, 'EW')}, ${fmtCoord(lat, 'NS')}`;
    $('elapsed').textContent = '';
    $('levels').innerHTML = `<p class="msg error">Error: ${esc(msg)}</p>`;
    panel('show');
  }

  function levelRowHTML({ label, icon, cls }, info) {
    const tags = buildNameTags(info.names, info.name);
    return `
      <div class="level-row">
        <div class="level-icon ${cls}">${icon}</div>
        <div class="level-meta">
          <div class="level-label">${label}</div>
          <div class="level-name" title="${esc(info.name || '')}">${esc(info.name || '—')}</div>
          ${tags.length ? `<div class="level-names">${tags.join('')}</div>` : ''}
        </div>
      </div>`;
  }

  function buildNameTags(names, primaryName) {
    if (!names) return [];
    const tags = [];
    for (const lang of LANG_PRIORITY) {
      const val = names[lang];
      if (!val || val === primaryName) continue;
      tags.push(
        `<span class="name-tag" title="${esc(lang + ': ' + val)}"><span class="lang-code">${esc(lang)}</span>${esc(val)}</span>`
      );
      if (tags.length >= 6) break;
    }
    return tags;
  }

  // ── Helpers ──────────────────────────────────────────────────────────────

  function fmtCoord(v, axis) {
    const abs = Math.abs(v).toFixed(5);
    const dir = axis === 'EW' ? (v >= 0 ? 'E' : 'W') : (v >= 0 ? 'N' : 'S');
    return `${abs}° ${dir}`;
  }

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function $(id) { return document.getElementById(id); }

  function setLoading(on) {
    $('loading').classList.toggle('hidden', !on);
  }

  function panel(state) {
    $('panel').classList.toggle('hidden', state === 'hidden');
  }

  function hint(hide) {
    $('hint').classList.toggle('hidden', hide);
  }
</script>
</body>
</html>
